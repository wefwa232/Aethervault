      <g class="r1"><circle r="93" fill="none" stroke="#3b362d" stroke-width="3" stroke-dasharray="1.4 7.64"/></g>

    </svg></div>

    <div class="boot-pct" id="bootPct">0%</div>
    <ol class="boot-steps" id="bootSteps" aria-hidden="true"></ol>
    <p class="boot-lore" id="bootLore" aria-hidden="true"></p>
    <section class="boot-err" id="bootErr" hidden role="alert"></section>
  </main>
  <footer class="boot-foot"><span id="bootVer">Aethervault</span><button class="boot-skip" id="bootSkip" type="button" hidden>Skip</button><span class="boot-hint" id="bootHint">Click or press a key to enable sound</span><span class="off"><i></i>Local archive · offline · no network used</span></footer>
